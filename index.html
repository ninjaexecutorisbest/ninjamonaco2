<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8" />
	<title>Lua Editor</title>
	<style>
		:root {
			--url: url("");
			--scrollbar-thumb: rgba(50, 50, 50, 0.3);
			--scrollbar-track: rgba(0, 0, 0, 0);
		}

		html, body {
			background-color: #181818;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: Arial, sans-serif;
			color: white;
		}

		#tabs-container {
			display: flex;
			align-items: center;
			background-color: #121212;
			padding: 8px 10px;
			border-bottom: 1px solid rgb(50, 50, 50);
			overflow-x: auto;
			white-space: nowrap;
			scrollbar-width: thin;
		}

		#tabs-container::-webkit-scrollbar {
			height: 6px;
		}

		#tabs-container::-webkit-scrollbar-thumb {
			background: var(--scrollbar-thumb);
			border-radius: 3px;
		}

		#tabs-container::-webkit-scrollbar-track {
			background: var(--scrollbar-track);
		}

		#lua-icon {
			width: 20px;
			height: 20px;
			margin-right: 10px;
			flex-shrink: 0;
		}

		.tab {
			display: flex;
			align-items: center;
			padding: 8px 15px;
			background: rgb(20, 20, 20);
			border: 1px solid rgb(50, 50, 50);
			border-radius: 5px 5px 0 0;
			cursor: pointer;
			opacity: 0;
			transform: translateY(-0px);
			animation: fadeIn 0.3s forwards;
			margin-right: 5px;
			white-space: nowrap;
			min-width: 50px;
			max-width: 250px;
			overflow: hidden;
			flex-shrink: 0;
			text-overflow: ellipsis;
			position: relative;
			transition: width 0.2s ease;
		}

		.tab img {
			width: 16px;
			height: 16px;
			margin-right: 8px;
		}

		@keyframes fadeIn {
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.tab.selected {
			background: linear-gradient(to bottom, rgb(49, 49, 49), rgb(14, 14, 14));
		}

		.tab span {
			font-size: 12px;
			margin-right: 5px;
			white-space: nowrap;
		}

		.close-btn {
			background: none;
			border: none;
			color: white;
			font-size: 12px;
			cursor: pointer;
			position: inherit;
		}

		#new-tab-btn {
			margin-left: 15px;
			background: rgb(30, 30, 30);
			border: 1px solid rgb(50, 50, 50);
			color: white;
			padding: 5px 10px;
			border-radius: 5px;
			cursor: pointer;
			position: relative;
			z-index: 10;
		}

		.rename-input {
			background-color: rgb(20, 20, 20);
			color: white;
			border: none;
			padding: 2px 5px;
			font-size: 12px;
			width: 100%;
			box-sizing: border-box;
			position: absolute;
			top: 15;
			left: 0;
			height: 25px;
			text-align: center;
		}

		#container {
			width: 100%;
			height: calc(100% - 45px);
		}
	</style>
</head>

<body>
	<div id="tabs-container">
		<img id="lua-icon" src="https://cdn-icons-png.flaticon.com/512/919/919836.png" alt="Lua Icon">
		<button id="new-tab-btn">+</button>
	</div>

	<div id="container"></div>

	<script src="vs/loader.js"></script>

</html>
